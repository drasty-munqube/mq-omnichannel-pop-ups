<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    a { color: #0B3D66; } a:hover { color: #7651D8; }
  </style>
</helmet>
<div style="width: 940px; height: 300px; box-sizing: border-box; padding: 30px 32px; background: #F6F6F7; display: flex; flex-direction: column; gap: 14px;">

  <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A94A6;">OPTION A &middot; SEGMENTED PROGRESS</div>

  <div style="background: #FFFFFF; border: 1px solid #E7EBEF; border-radius: 14px; box-shadow: 0 1px 2px rgba(23, 32, 51, 0.05); overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px 0;">
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="font-size: 15px; font-weight: 600; color: #172033;">Create campaign</span>
        <span style="font-size: 13px; color: #9AA4B2;">&middot;</span>
        <span style="font-size: 13px; font-weight: 600; color: #7651D8;">{{ currentName }}</span>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12px; color: #9AA4B2;">Step {{ current }} of 6</span>
        <span style="display: inline-block; padding: 3px 8px; border-radius: 999px; background: #F0EAFE; color: #6546D7; font-size: 11px; font-weight: 700;">{{ percent }}%</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; padding: 20px 24px 22px;">
      <sc-for list="{{ steps }}" as="item" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 9px; flex-grow: 1;">
          <div style="{{ item.barStyle }}"></div>

          <div style="display: flex; align-items: center; gap: 5px;">
            <sc-if value="{{ item.done }}" hint-placeholder-val="{{ false }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0B3D66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </sc-if>
            <span style="{{ item.labelStyle }}">{{ item.name }}</span>
          </div>
        </div>
      </sc-for>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"step":{"editor":"range","default":3,"min":1,"max":6,"step":1,"section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.step ?? 3;
    const names = ["Details", "Audience", "Popup", "Trigger", "Reward", "Review"];

    const steps = names.map((name, index) => {
      const number = index + 1;
      const done = number < current;
      const active = number === current;

      let barStyle = "height: 6px; border-radius: 999px; background: #E5E9EE;";
      let labelStyle = "font-size: 12px; font-weight: 500; color: #9AA4B2;";

      if (done) {
        barStyle = "height: 6px; border-radius: 999px; background: #0B3D66;";
        labelStyle = "font-size: 12px; font-weight: 500; color: #6B7280;";
      }

      if (active) {
        barStyle = "height: 6px; border-radius: 999px; background: linear-gradient(90deg, #0B3D66, #7651D8); box-shadow: 0 2px 9px rgba(118, 81, 216, 0.38);";
        labelStyle = "font-size: 12px; font-weight: 700; color: #0B3D66; letter-spacing: -0.01em;";
      }

      return { name, done, active, barStyle, labelStyle };
    });

    return {
      steps,
      current,
      currentName: names[current - 1],
      percent: Math.round((current / 6) * 100),
    };
  }
}
</script>
</body>
</html>
