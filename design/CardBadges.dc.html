<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    a { color: #0B3D66; } a:hover { color: #7651D8; }
  </style>
</helmet>
<div style="width: 940px; height: 300px; box-sizing: border-box; padding: 30px 32px; background: #F6F6F7; display: flex; flex-direction: column; gap: 14px;">

  <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A94A6;">OPTION B &middot; ELEVATED STEP CARDS</div>

  <div style="background: #FFFFFF; border: 1px solid #E7EBEF; border-radius: 14px; box-shadow: 0 1px 2px rgba(23, 32, 51, 0.05); overflow: hidden;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px 0;">
      <span style="font-size: 15px; font-weight: 600; color: #172033;">Create campaign</span>
      <span style="font-size: 12px; color: #9AA4B2;">Step {{ current }} of 6</span>
    </div>

    <div style="display: flex; gap: 8px; padding: 18px 24px 22px;">
      <sc-for list="{{ steps }}" as="item" hint-placeholder-count="6">
        <div style="{{ item.cardStyle }}">
          <div style="display: flex; align-items: center; gap: 9px;">
            <div style="{{ item.badgeStyle }}">
              <sc-if value="{{ item.done }}" hint-placeholder-val="{{ false }}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </sc-if>
              <sc-if value="{{ item.pending }}" hint-placeholder-val="{{ true }}">
                <span style="{{ item.numberStyle }}">{{ item.number }}</span>
              </sc-if>
            </div>

            <span style="{{ item.labelStyle }}">{{ item.name }}</span>
          </div>

          <div style="{{ item.accentStyle }}"></div>
        </div>
      </sc-for>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"step":{"editor":"range","default":3,"min":1,"max":6,"step":1,"section":"State"}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.step ?? 3;
    const names = ["Details", "Audience", "Popup", "Trigger", "Reward", "Review"];

    const steps = names.map((name, index) => {
      const number = index + 1;
      const done = number < current;
      const active = number === current;

      const badgeBase =
        "width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;";

      let cardStyle =
        "flex-grow: 1; position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: 11px 12px 10px; border: 1px solid #DCE3EA; border-radius: 10px; background: #FFFFFF; overflow: hidden;";
      let badgeStyle = badgeBase + " background: #EEF1F4;";
      let numberStyle = "font-size: 11px; font-weight: 700; color: #7B8796;";
      let labelStyle = "font-size: 12px; font-weight: 500; color: #7B8796;";
      let accentStyle = "height: 3px; border-radius: 999px; background: transparent;";

      if (done) {
        badgeStyle = badgeBase + " background: #0B3D66;";
        labelStyle = "font-size: 12px; font-weight: 500; color: #6B7280;";
        accentStyle = "height: 3px; border-radius: 999px; background: #DCE3EA;";
      }

      if (active) {
        cardStyle =
          "flex-grow: 1; position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: 11px 12px 10px; border: 1.5px solid #0B3D66; border-radius: 10px; background: #F3F7FB; box-shadow: 0 6px 16px rgba(11, 61, 102, 0.14); overflow: hidden;";
        badgeStyle =
          badgeBase + " background: linear-gradient(135deg, #0B3D66, #7651D8);";
        numberStyle = "font-size: 11px; font-weight: 700; color: #FFFFFF;";
        labelStyle = "font-size: 12px; font-weight: 700; color: #0B3D66; letter-spacing: -0.01em;";
        accentStyle = "height: 3px; border-radius: 999px; background: linear-gradient(90deg, #0B3D66, #7651D8);";
      }

      return {
        name,
        number,
        done,
        pending: !done,
        cardStyle,
        badgeStyle,
        numberStyle,
        labelStyle,
        accentStyle,
      };
    });

    return { steps, current };
  }
}
</script>
</body>
</html>
